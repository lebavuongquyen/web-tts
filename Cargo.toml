[package]
name = "rust_tts_runtime"
version = "0.1.0"
edition = "2021"
description = "High-Performance Standalone Rust TTS Runtime with Smart Chunking, SRT Subtitles, Voice Cloning & Quantization"

[lib]
name = "rust_tts_runtime"
path = "src/lib.rs"

[[bin]]
name = "rust_tts_runtime"
path = "src/main.rs"

[[bin]]
name = "rtts-bench"
path = "src/test_run.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
rand = "0.8"
regex = "1.10"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "cuda", "api-20"] }
ndarray = "0.16"
byteorder = "1.5"
mimalloc = { version = "0.1", default-features = false }
