[package]
name = "zerotts-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "test_ort"
path = "src/test_ort.rs"

[[bin]]
name = "test_tokenizer"
path = "src/test_tokenizer.rs"

[[bin]]
name = "test_run"
path = "src/test_run.rs"

[[bin]]
name = "zerotts"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
rand = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "cuda", "api-20"] }
ndarray = "0.16"
byteorder = "1.5"
