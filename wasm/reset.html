<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Resetting Service Worker &amp; Cache...</title>
  <style>
    body {
      background: #080c15;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 18px; font-weight: 600; color: #38bdf8; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="status" id="statusText">🔄 Đang giải phóng Service Worker và làm mới Cache...</div>
  <script>
    async function clearAllAndReload() {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) {
            await reg.unregister();
            console.log('[Reset] Unregistered SW:', reg.scope);
          }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const key of keys) {
            await caches.delete(key);
            console.log('[Reset] Deleted cache storage:', key);
          }
        }
      } catch (err) {
        console.error('[Reset] Error clearing cache:', err);
      }
      document.getElementById('statusText').innerText = '✓ Hoàn tất! Đang chuyển hướng về trang Demo VieNeu-TTS...';
      setTimeout(() => {
        window.location.replace('./?v=' + Date.now());
      }, 500);
    }
    clearAllAndReload();
  </script>
</body>
</html>
